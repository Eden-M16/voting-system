<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoteChain - Advanced Blockchain Voting</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #3B82F6;
            --primary-glow: rgba(59, 130, 246, 0.5);
            --secondary: #8B5CF6;
            --accent: #10B981;
            --bg-dark: #0B0E14;
            --card-bg: rgba(31, 41, 55, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #F3F4F6;
            --text-muted: #9CA3AF;
            --danger: #EF4444;
            --warning: #F59E0B;
            --gradient-main: linear-gradient(135deg, #3B82F6 0%, #8B5CF6 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(139, 92, 246, 0.15) 0%, transparent 50%);
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--text-main);
            line-height: 1.6;
        }

        .container { max-width: 1400px; margin: 0 auto; padding: 30px; position: relative; z-index: 1; }

        /* Animated Background Pattern */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            z-index: -1;
        }

        /* Header */
        .header {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 24px 40px;
            margin-bottom: 40px;
            border: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .logo-container { display: flex; align-items: center; gap: 15px; }
        .logo-icon { 
            font-size: 32px; 
            background: var(--gradient-main); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            filter: drop-shadow(0 0 10px var(--primary-glow));
            animation: pulse-glow 3s infinite;
        }

        @keyframes pulse-glow {
            0% { filter: drop-shadow(0 0 5px var(--primary-glow)); }
            50% { filter: drop-shadow(0 0 15px var(--primary-glow)); }
            100% { filter: drop-shadow(0 0 5px var(--primary-glow)); }
        }

        .logo h1 {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -1px;
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
        }

        .logo h1::after {
            content: "SECURE";
            position: absolute;
            top: -10px; right: -20px;
            font-size: 8px;
            background: var(--primary);
            color: white;
            padding: 2px 5px;
            border-radius: 4px;
            letter-spacing: 1px;
        }

        .logo p { font-size: 14px; color: var(--text-muted); font-weight: 500; }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            background: rgba(59, 130, 246, 0.1);
            color: var(--primary);
            border: 1px solid rgba(59, 130, 246, 0.2);
            vertical-align: middle;
            margin-left: 10px;
        }

        .wallet-status { display: flex; align-items: center; gap: 20px; }
        .network-badge { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            background: rgba(16, 185, 129, 0.1); 
            padding: 10px 20px; 
            border-radius: 14px; 
            font-size: 14px; 
            font-weight: 600; 
            color: var(--accent);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
        
        .connect-btn { 
            background: var(--gradient-main); 
            color: white; 
            border: none; 
            padding: 14px 28px; 
            border-radius: 14px; 
            font-weight: 700; 
            cursor: pointer; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            box-shadow: 0 4px 15px var(--primary-glow);
        }
        .connect-btn:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 8px 25px var(--primary-glow); }

        /* Stats Cards */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 25px; margin-bottom: 40px; }
        .stat-card { 
            background: var(--card-bg); 
            backdrop-filter: blur(12px);
            border-radius: 24px; 
            padding: 30px; 
            text-align: left; 
            transition: all 0.3s ease; 
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .stat-card:hover { transform: translateY(-5px); border-color: rgba(59, 130, 246, 0.4); background: rgba(31, 41, 55, 0.8); }
        .stat-icon { 
            width: 60px; height: 60px; 
            background: rgba(59, 130, 246, 0.1); 
            border-radius: 18px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: var(--primary); 
            font-size: 24px;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }
        .stat-info h3 { font-size: 32px; font-weight: 800; color: white; margin-bottom: 4px; }
        .stat-info p { color: var(--text-muted); font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

        /* Tabs */
        .tabs { 
            display: flex; 
            gap: 15px; 
            margin-bottom: 30px; 
            padding: 8px;
            background: rgba(31, 41, 55, 0.4);
            border-radius: 20px;
            width: fit-content;
            border: 1px solid var(--glass-border);
        }
        .tab-btn { 
            background: transparent; 
            border: none; 
            padding: 12px 24px; 
            border-radius: 14px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            color: var(--text-muted); 
        }
        .tab-btn.active { background: var(--gradient-main); color: white; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3); }
        .tab-btn:hover:not(.active) { color: white; background: rgba(255, 255, 255, 0.05); }

        /* Panels */
        .admin-panel, .register-panel, .control-panel { 
            background: var(--card-bg); 
            backdrop-filter: blur(12px);
            border-radius: 28px; 
            padding: 40px; 
            margin-bottom: 40px; 
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        h2 { font-size: 24px; margin-bottom: 30px; display: flex; align-items: center; gap: 15px; color: white; }
        h2 i { color: var(--primary); }

        .form-group { margin-bottom: 25px; }
        .form-group label { display: block; margin-bottom: 10px; font-weight: 600; color: var(--text-muted); font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .form-control { 
            width: 100%; 
            padding: 16px 20px; 
            background: rgba(17, 24, 39, 0.8);
            border: 1px solid var(--glass-border); 
            border-radius: 16px; 
            color: white;
            font-family: inherit; 
            transition: all 0.3s; 
            font-size: 16px;
        }
        .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); background: rgba(17, 24, 39, 1); }

        .candidate-input-group, .voter-input-group { 
            display: flex; 
            gap: 15px; 
            margin-bottom: 15px; 
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            border: 1px dashed var(--glass-border);
        }
        .candidate-input-group input, .voter-input-group input { 
            flex: 1; 
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--glass-border);
            padding: 10px 5px;
            color: white;
            transition: all 0.3s;
        }
        .candidate-input-group input:focus { outline: none; border-color: var(--primary); }

        .btn-primary { 
            background: var(--gradient-main); 
            color: white; 
            border: none; 
            padding: 16px 32px; 
            border-radius: 16px; 
            font-weight: 700; 
            cursor: pointer; 
            width: 100%; 
            margin-top: 15px; 
            font-size: 16px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4); }
        .btn-primary:active { transform: translateY(0); }

        .btn-secondary { 
            background: rgba(255, 255, 255, 0.05); 
            color: white; 
            border: 1px solid var(--glass-border); 
            padding: 10px 20px; 
            border-radius: 12px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.3s;
        }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--primary); }

        /* Election Cards */
        .elections-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 30px; }
        .election-card { 
            background: var(--card-bg); 
            backdrop-filter: blur(12px);
            border-radius: 28px; 
            overflow: hidden; 
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); 
            border: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
        }
        .election-card:hover { transform: translateY(-10px); border-color: rgba(59, 130, 246, 0.3); box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4); }
        
        .card-header { 
            padding: 30px; 
            background: linear-gradient(to bottom, rgba(59, 130, 246, 0.1), transparent);
            border-bottom: 1px solid var(--glass-border);
            position: relative; 
        }
        .card-header h3 { font-size: 24px; font-weight: 800; color: white; margin-bottom: 8px; }
        
        .status-badge { 
            position: absolute; 
            top: 30px; 
            right: 30px; 
            padding: 6px 14px; 
            border-radius: 10px; 
            font-size: 11px; 
            font-weight: 800; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .status-active { background: rgba(16, 185, 129, 0.15); color: var(--accent); border: 1px solid rgba(16, 185, 129, 0.3); box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); }
        .status-ended { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }
        .status-paused { background: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.3); }

        .card-body { padding: 30px; flex: 1; display: flex; flex-direction: column; }
        .election-meta { 
            display: flex; 
            gap: 20px; 
            margin-bottom: 30px; 
            font-size: 13px; 
            color: var(--text-muted); 
            flex-wrap: wrap; 
            padding-bottom: 20px;
            border-bottom: 1px solid var(--glass-border);
        }
        .election-meta span { display: flex; align-items: center; gap: 8px; }
        .election-meta i { color: var(--primary); font-size: 14px; }

        .candidate-item { 
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid var(--glass-border);
            transition: all 0.3s ease;
        }
        .candidate-item:hover { background: rgba(255, 255, 255, 0.06); border-color: rgba(59, 130, 246, 0.2); }
        
        .candidate-info { display: flex; align-items: center; gap: 18px; margin-bottom: 15px; }
        .candidate-avatar { 
            width: 48px; height: 48px; 
            background: var(--gradient-main); 
            border-radius: 14px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: white; 
            font-weight: 800; 
            font-size: 20px;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
        }
        .candidate-details { flex: 1; }
        .candidate-name { font-weight: 700; color: white; font-size: 17px; margin-bottom: 2px; }
        .candidate-desc { font-size: 13px; color: var(--text-muted); }
        .vote-count { font-weight: 800; color: var(--primary); font-size: 18px; }

        .vote-btn { 
            background: var(--gradient-main); 
            color: white; 
            border: none; 
            padding: 10px 24px; 
            border-radius: 12px; 
            font-weight: 700; 
            cursor: pointer; 
            transition: all 0.3s; 
            font-size: 14px;
        }
        .vote-btn:hover { transform: scale(1.05); box-shadow: 0 5px 15px rgba(59, 130, 246, 0.3); }

        .voted-badge { 
            background: rgba(16, 185, 129, 0.1); 
            color: var(--accent); 
            padding: 8px 16px; 
            border-radius: 10px; 
            font-size: 13px; 
            font-weight: 700;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .progress-bar { height: 8px; background: rgba(255, 255, 255, 0.05); border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--gradient-main); border-radius: 10px; transition: width 1s cubic-bezier(0.19, 1, 0.22, 1); position: relative; }
        .progress-fill::after {
            content: "";
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            animation: progress-shimmer 2s infinite;
        }
        @keyframes progress-shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

        .winner-panel {
            margin-top: 20px;
            padding: 20px;
            background: rgba(245, 158, 11, 0.05);
            border: 1px solid rgba(245, 158, 11, 0.2);
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .winner-icon { font-size: 24px; color: var(--warning); }
        .winner-info { flex: 1; }
        .winner-info strong { color: var(--warning); display: block; font-size: 12px; text-transform: uppercase; margin-bottom: 2px; }
        .winner-name { color: white; font-weight: 700; font-size: 16px; }

        /* Toast */
        .toast-container { position: fixed; bottom: 30px; right: 30px; z-index: 2000; }
        .toast { 
            background: rgba(31, 41, 55, 0.9); 
            backdrop-filter: blur(10px);
            border-radius: 16px; 
            padding: 18px 25px; 
            margin-top: 15px; 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); 
            border: 1px solid var(--glass-border);
            animation: slideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            min-width: 300px;
        }
        @keyframes slideIn { from { transform: translateX(120%); } to { transform: translateX(0); } }
        .toast.success { border-left: 6px solid var(--accent); }
        .toast.error { border-left: 6px solid var(--danger); }
        .toast.info { border-left: 6px solid var(--primary); }
        .toast i { font-size: 20px; }

        /* Modal */
        .modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(10px); z-index: 3000; 
            align-items: center; justify-content: center; 
        }
        .modal.active { display: flex; animation: modalIn 0.3s ease-out; }
        @keyframes modalIn { from { opacity: 0; } to { opacity: 1; } }
        
        .modal-content { 
            background: var(--bg-dark); 
            border: 1px solid var(--glass-border);
            border-radius: 32px; 
            padding: 50px; 
            max-width: 450px; 
            width: 90%; 
            text-align: center; 
            box-shadow: 0 25px 70px rgba(0,0,0,0.6);
        }
        .modal-content i { margin-bottom: 25px; filter: drop-shadow(0 0 15px var(--primary-glow)); }
        .modal-content h3 { font-size: 28px; font-weight: 800; color: white; margin-bottom: 15px; }
        .modal-content p { color: var(--text-muted); font-size: 16px; margin-bottom: 30px; }
        .modal-buttons { display: flex; gap: 15px; }

        .loading-spinner { 
            display: inline-block; width: 22px; height: 22px; 
            border: 3px solid rgba(255,255,255,0.2); border-radius: 50%; 
            border-top-color: white; animation: spin 0.8s linear infinite; 
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 1024px) { .elections-grid { grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); } }
        @media (max-width: 768px) { 
            .container { padding: 20px; }
            .header { flex-direction: column; padding: 30px; text-align: center; gap: 25px; }
            .wallet-status { flex-direction: column; width: 100%; }
            .connect-btn { width: 100%; justify-content: center; }
            .stats-grid { grid-template-columns: 1fr; }
            .tabs { width: 100%; overflow-x: auto; white-space: nowrap; padding: 5px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo-container">
                <div class="logo-icon"><i class="fas fa-link"></i></div>
                <div class="logo">
                    <h1>VoteChain <span class="badge">V2.0</span></h1>
                    <p><i class="fas fa-shield-alt"></i> Secure • Transparent • Immutable</p>
                </div>
            </div>
            <div class="wallet-status">
                <div class="network-badge"><i class="fas fa-circle" style="font-size: 8px;"></i> <span id="networkStatus">Not Connected</span></div>
                <button class="connect-btn" id="connectWalletBtn">
                    <i class="fas fa-wallet"></i>
                    <span>Connect Wallet</span>
                </button>
            </div>
        </div>

        <div class="stats-grid" id="statsGrid" style="display: none;">
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-layer-group"></i></div>
                <div class="stat-info"><h3 id="totalElections">0</h3><p>Total Events</p></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-bolt"></i></div>
                <div class="stat-info"><h3 id="activeElections">0</h3><p>Live Now</p></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-vote-yea"></i></div>
                <div class="stat-info"><h3 id="totalVotes">0</h3><p>Votes Cast</p></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-user-shield"></i></div>
                <div class="stat-info"><h3 id="adminStatus">-</h3><p>Privileges</p></div>
            </div>
        </div>

        <div class="tabs" id="tabs" style="display: none;">
            <button class="tab-btn active" data-tab="active"><i class="fas fa-broadcast-tower"></i> Active</button>
            <button class="tab-btn" data-tab="ended"><i class="fas fa-history"></i> Archived</button>
            <button class="tab-btn admin-tab" data-tab="admin" id="adminTabBtn" style="display: none;"><i class="fas fa-plus-square"></i> Create</button>
            <button class="tab-btn admin-tab" data-tab="register" id="registerTabBtn" style="display: none;"><i class="fas fa-users-cog"></i> Register</button>
            <button class="tab-btn admin-tab" data-tab="controls" id="controlsTabBtn" style="display: none;"><i class="fas fa-tools"></i> Manage</button>
        </div>

        <!-- Admin Panel - Create Election -->
        <div id="adminPanel" class="admin-panel" style="display: none;">
            <h2><i class="fas fa-plus-circle"></i> Launch New Election</h2>
            <div class="form-group"><label>Event Title</label><input type="text" id="electionTitle" class="form-control" placeholder="e.g., Governance Proposal #42"></div>
            <div class="form-group"><label>Mission Description</label><textarea id="electionDesc" class="form-control" rows="2" placeholder="Describe the purpose of this vote..."></textarea></div>
            <div class="form-group"><label>Window (Minutes)</label><input type="number" id="durationMinutes" class="form-control" value="1440"></div>
            <div class="form-group">
                <label>Candidates / Options</label>
                <div id="candidatesContainer">
                    <div class="candidate-input-group">
                        <input type="text" placeholder="Option Name">
                        <input type="text" placeholder="Short Description">
                    </div>
                </div>
                <button type="button" id="addCandidateBtn" class="btn-secondary" style="margin-top: 10px;"><i class="fas fa-plus"></i> Add Option</button>
            </div>
            <button id="createElectionBtn" class="btn-primary"><i class="fas fa-rocket"></i> Deploy to Blockchain</button>
        </div>

        <!-- Register Voters Panel -->
        <div id="registerPanel" class="register-panel" style="display: none;">
            <h2><i class="fas fa-user-check"></i> Whitelist Voters</h2>
            <div class="form-group"><label>Election ID</label><input type="number" id="registerElectionId" class="form-control" placeholder="Target Election ID"></div>
            <div class="form-group">
                <label>Voter Wallet Addresses</label>
                <div id="votersContainer">
                    <div class="voter-input-group"><input type="text" placeholder="0x..."></div>
                </div>
                <button type="button" id="addVoterBtn" class="btn-secondary" style="margin-top: 10px;"><i class="fas fa-plus"></i> Add More</button>
            </div>
            <button id="registerVotersBtn" class="btn-primary"><i class="fas fa-user-shield"></i> Authorize Voters</button>
        </div>

        <!-- Election Controls Panel -->
        <div id="controlsPanel" class="control-panel" style="display: none;">
            <h2><i class="fas fa-sliders-h"></i> System Controls</h2>
            <div class="form-group"><label>Target Election ID</label><input type="number" id="controlElectionId" class="form-control" placeholder="ID"></div>
            <div class="control-buttons">
                <button id="pauseElectionBtn" class="btn-secondary" style="color: var(--warning);"><i class="fas fa-pause"></i> Pause</button>
                <button id="unpauseElectionBtn" class="btn-secondary" style="color: var(--primary);"><i class="fas fa-play"></i> Resume</button>
                <button id="endElectionBtn" class="btn-secondary" style="color: var(--danger);"><i class="fas fa-stop"></i> Terminate</button>
                <div style="margin-top: 20px; display: flex; gap: 15px; width: 100%;">
                    <input type="number" id="extendMinutes" class="form-control" placeholder="Extra Mins" style="flex:1;">
                    <button id="extendElectionBtn" class="btn-secondary" style="flex:1;">Extend Time</button>
                </div>
            </div>
        </div>

        <!-- Elections Container -->
        <div id="electionsContainer"></div>
    </div>

    <div class="toast-container" id="toastContainer"></div>
    
    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <i class="fas fa-fingerprint" style="font-size: 64px; color: var(--primary);"></i>
            <h3>Authorize Vote</h3>
            <p id="confirmMessage">Confirm your selection for this proposal.</p>
            <div class="modal-buttons">
                <button id="confirmVoteBtn" class="btn-primary">Confirm</button>
                <button id="cancelVoteBtn" class="btn-secondary">Cancel</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/ethers@6.10.0/dist/ethers.umd.min.js"></script>
    <script>
        // Custom interactive background effect
        document.addEventListener('mousemove', (e) => {
            const body = document.body;
            const x = e.clientX / window.innerWidth * 100;
            const y = e.clientY / window.innerHeight * 100;
            body.style.backgroundImage = `
                radial-gradient(circle at ${x}% ${y}%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at ${100-x}% ${100-y}%, rgba(139, 92, 246, 0.15) 0%, transparent 50%)
            `;
        });

        // Contract deployed on Sepolia
        const CONTRACT_ADDRESS = "0xf3bf8AeACd2e1C8439EA67F01044cb666134f840";
        
        // Contract ABI (one-person-one-vote, no weights)
        const CONTRACT_ABI = [{"inputs":[{"internalType":"string","name":"_title","type":"string"},{"internalType":"string","name":"_description","type":"string"},{"internalType":"uint256","name":"_durationInMinutes","type":"uint256"},{"internalType":"string[]","name":"_candidateNames","type":"string[]"},{"internalType":"string[]","name":"_candidateDescriptions","type":"string[]"}],"name":"createElection","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"nonpayable","type":"function"},{"inputs":[],"stateMutability":"nonpayable","type":"constructor"},{"anonymous":false,"inputs":[{"indexed":true,"internalType":"uint256","name":"electionId","type":"uint256"},{"indexed":false,"internalType":"string","name":"title","type":"string"},{"indexed":true,"internalType":"address","name":"creator","type":"address"},{"indexed":false,"internalType":"uint256","name":"startTime","type":"uint256"},{"indexed":false,"internalType":"uint256","name":"endTime","type":"uint256"}],"name":"ElectionCreated","type":"event"},{"anonymous":false,"inputs":[{"indexed":true,"internalType":"uint256","name":"electionId","type":"uint256"},{"indexed":false,"internalType":"uint256","name":"totalVotes","type":"uint256"}],"name":"ElectionEnded","type":"event"},{"anonymous":false,"inputs":[{"indexed":true,"internalType":"uint256","name":"electionId","type":"uint256"},{"indexed":false,"internalType":"uint256","name":"newEndTime","type":"uint256"}],"name":"ElectionExtended","type":"event"},{"anonymous":false,"inputs":[{"indexed":true,"internalType":"uint256","name":"electionId","type":"uint256"}],"name":"ElectionPaused","type":"event"},{"anonymous":false,"inputs":[{"indexed":true,"internalType":"uint256","name":"electionId","type":"uint256"}],"name":"ElectionUnpaused","type":"event"},{"inputs":[{"internalType":"uint256","name":"_electionId","type":"uint256"}],"name":"endElection","outputs":[],"stateMutability":"nonpayable","type":"function"},{"inputs":[{"internalType":"uint256","name":"_electionId","type":"uint256"},{"internalType":"uint256","name":"_extraMinutes","type":"uint256"}],"name":"extendElection","outputs":[],"stateMutability":"nonpayable","type":"function"},{"inputs":[{"internalType":"uint256","name":"_electionId","type":"uint256"}],"name":"pauseElection","outputs":[],"stateMutability":"nonpayable","type":"function"},{"inputs":[{"internalType":"uint256","name":"_electionId","type":"uint256"},{"internalType":"address[]","name":"_voters","type":"address[]"}],"name":"registerVoters","outputs":[],"stateMutability":"nonpayable","type":"function"},{"inputs":[{"internalType":"address","name":"newOwner","type":"address"}],"name":"transferOwnership","outputs":[],"stateMutability":"nonpayable","type":"function"},{"inputs":[{"internalType":"uint256","name":"_electionId","type":"uint256"}],"name":"unpauseElection","outputs":[],"stateMutability":"nonpayable","type":"function"},{"inputs":[{"internalType":"uint256","name":"_electionId","type":"uint256"},{"internalType":"uint256","name":"_candidateId","type":"uint256"}],"name":"vote","outputs":[],"stateMutability":"nonpayable","type":"function"},{"anonymous":false,"inputs":[{"indexed":true,"internalType":"uint256","name":"electionId","type":"uint256"},{"indexed":true,"internalType":"address","name":"voter","type":"address"},{"indexed":false,"internalType":"uint256","name":"candidateId","type":"uint256"},{"indexed":false,"internalType":"string","name":"candidateName","type":"string"}],"name":"Voted","type":"event"},{"anonymous":false,"inputs":[{"indexed":true,"internalType":"uint256","name":"electionId","type":"uint256"},{"indexed":true,"internalType":"address","name":"voter","type":"address"}],"name":"VoterRegistered","type":"event"},{"inputs":[{"internalType":"uint256","name":"","type":"uint256"},{"internalType":"uint256","name":"","type":"uint256"}],"name":"candidates","outputs":[{"internalType":"string","name":"name","type":"string"},{"internalType":"string","name":"description","type":"string"},{"internalType":"uint256","name":"voteCount","type":"uint256"}],"stateMutability":"view","type":"function"},{"inputs":[{"internalType":"uint256","name":"_electionId","type":"uint256"},{"internalType":"address","name":"_voter","type":"address"}],"name":"checkHasVoted","outputs":[{"internalType":"bool","name":"","type":"bool"}],"stateMutability":"view","type":"function"},{"inputs":[],"name":"electionCount","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},{"inputs":[{"internalType":"uint256","name":"","type":"uint256"}],"name":"elections","outputs":[{"internalType":"string","name":"title","type":"string"},{"internalType":"string","name":"description","type":"string"},{"internalType":"address","name":"creator","type":"address"},{"internalType":"uint256","name":"startTime","type":"uint256"},{"internalType":"uint256","name":"endTime","type":"uint256"},{"internalType":"bool","name":"isActive","type":"bool"},{"internalType":"bool","name":"isPaused","type":"bool"},{"internalType":"uint256","name":"totalVotes","type":"uint256"}],"stateMutability":"view","type":"function"},{"inputs":[{"internalType":"uint256","name":"_electionId","type":"uint256"}],"name":"getAllCandidates","outputs":[{"internalType":"string[]","name":"names","type":"string[]"},{"internalType":"string[]","name":"descriptions","type":"string[]"},{"internalType":"uint256[]","name":"voteCounts","type":"uint256[]"}],"stateMutability":"view","type":"function"},{"inputs":[{"internalType":"uint256","name":"_electionId","type":"uint256"},{"internalType":"uint256","name":"_candidateId","type":"uint256"}],"name":"getCandidate","outputs":[{"internalType":"string","name":"name","type":"string"},{"internalType":"string","name":"description","type":"string"},{"internalType":"uint256","name":"voteCount","type":"uint256"}],"stateMutability":"view","type":"function"},{"inputs":[{"internalType":"uint256","name":"_electionId","type":"uint256"}],"name":"getElectionInfo","outputs":[{"internalType":"string","name":"title","type":"string"},{"internalType":"string","name":"description","type":"string"},{"internalType":"address","name":"creator","type":"address"},{"internalType":"uint256","name":"startTime","type":"uint256"},{"internalType":"uint256","name":"endTime","type":"uint256"},{"internalType":"bool","name":"isActive","type":"bool"},{"internalType":"bool","name":"isPaused","type":"bool"},{"internalType":"uint256","name":"totalVotes","type":"uint256"},{"internalType":"uint256","name":"candidateCount","type":"uint256"},{"internalType":"uint256","name":"registeredVoterCount","type":"uint256"}],"stateMutability":"view","type":"function"},{"inputs":[{"internalType":"uint256","name":"_electionId","type":"uint256"}],"name":"getElectionWinner","outputs":[{"internalType":"uint256","name":"candidateId","type":"uint256"},{"internalType":"string","name":"name","type":"string"},{"internalType":"uint256","name":"voteCount","type":"uint256"}],"stateMutability":"view","type":"function"},{"inputs":[{"internalType":"uint256","name":"_electionId","type":"uint256"}],"name":"getRegisteredVoters","outputs":[{"internalType":"address[]","name":"voters","type":"address[]"}],"stateMutability":"view","type":"function"},{"inputs":[{"internalType":"uint256","name":"_electionId","type":"uint256"},{"internalType":"address","name":"_voter","type":"address"}],"name":"getVoterInfo","outputs":[{"internalType":"bool","name":"registered","type":"bool"},{"internalType":"bool","name":"voted","type":"bool"},{"internalType":"uint256","name":"votedForCandidateId","type":"uint256"},{"internalType":"uint256","name":"votedAt","type":"uint256"}],"stateMutability":"view","type":"function"},{"inputs":[{"internalType":"uint256","name":"_electionId","type":"uint256"},{"internalType":"address","name":"_voter","type":"address"}],"name":"isVoterRegistered","outputs":[{"internalType":"bool","name":"","type":"bool"}],"stateMutability":"view","type":"function"},{"inputs":[],"name":"owner","outputs":[{"internalType":"address","name":"","type":"address"}],"stateMutability":"view","type":"function"},{"inputs":[{"internalType":"uint256","name":"","type":"uint256"},{"internalType":"uint256","name":"","type":"uint256"}],"name":"registeredVotersList","outputs":[{"internalType":"address","name":"","type":"address"}],"stateMutability":"view","type":"function"},{"inputs":[{"internalType":"uint256","name":"","type":"uint256"},{"internalType":"address","name":"","type":"address"}],"name":"voterHistory","outputs":[{"internalType":"bool","name":"","type":"bool"}],"stateMutability":"view","type":"function"},{"inputs":[{"internalType":"uint256","name":"","type":"uint256"},{"internalType":"address","name":"","type":"address"}],"name":"voterInfo","outputs":[{"internalType":"bool","name":"registered","type":"bool"},{"internalType":"bool","name":"voted","type":"bool"},{"internalType":"uint256","name":"votedForCandidateId","type":"uint256"},{"internalType":"uint256","name":"votedAt","type":"uint256"}],"stateMutability":"view","type":"function"}];
        
        let provider, signer, contract, userAddress;
        let electionsData = [], currentTab = 'active', pendingVote = null;
        let chainNow = null; // latest block timestamp (seconds)
        
        function showToast(msg, type) { 
            let t = document.createElement('div'); 
            t.className = `toast ${type}`; 
            let icon = type === 'success' ? 'fa-check-double' : type === 'error' ? 'fa-exclamation-triangle' : 'fa-info-circle';
            t.innerHTML = `<i class="fas ${icon}"></i><span>${msg}</span>`; 
            document.getElementById('toastContainer').appendChild(t); 
            setTimeout(() => {
                t.style.opacity = '0';
                t.style.transform = 'translateX(20px)';
                setTimeout(() => t.remove(), 400);
            }, 5000); 
        }

        function getReadableError(e) {
            if (!e) return 'Unknown error';
            if (typeof e === 'string') return e;
            if (e.shortMessage) return e.shortMessage;
            if (e.reason) return e.reason;
            if (e.info && e.info.error && e.info.error.message) return e.info.error.message;
            if (e.data && typeof e.data.message === 'string') return e.data.message;
            if (e.message) return e.message;
            try { return JSON.stringify(e); } catch { return 'Unknown error'; }
        }

        async function refreshChainNow() {
            if (!provider) return null;
            const block = await provider.getBlock('latest');
            chainNow = Number(block.timestamp);
            return chainNow;
        }
        
        document.getElementById('connectWalletBtn').onclick = async () => {
            if (!window.ethereum) { showToast('Install MetaMask!', 'error'); window.open('https://metamask.io/download.html'); return; }
            try {
                provider = new ethers.BrowserProvider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                signer = await provider.getSigner();
                userAddress = await signer.getAddress();
                let network = await provider.getNetwork();
                if (Number(network.chainId) !== 11155111) { showToast('Switch to Sepolia', 'error'); try { await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: '0xaa36a7' }] }); } catch(e){} return; }

                // Verify the address actually has contract bytecode on Sepolia
                const code = await provider.getCode(CONTRACT_ADDRESS);
                if (!code || code === '0x') {
                    showToast('No contract found at this address on Sepolia. Check CONTRACT_ADDRESS / network.', 'error');
                    return;
                }

                contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);
                document.getElementById('networkStatus').innerHTML = '<i class="fas fa-check-circle"></i> Sepolia';
                document.querySelector('.connect-btn span').textContent = `${userAddress.slice(0,6)}...${userAddress.slice(-4)}`;
                document.getElementById('statsGrid').style.display = 'grid';
                document.getElementById('tabs').style.display = 'flex';
                let owner;
                try {
                    owner = await contract.owner();
                } catch (e) {
                    showToast('Contract ABI/address mismatch (owner() failed): ' + getReadableError(e), 'error');
                    return;
                }
                let isAdmin = userAddress.toLowerCase() === owner.toLowerCase();
                if (isAdmin) { document.getElementById('adminStatus').innerHTML = 'Admin'; document.getElementById('adminTabBtn').style.display = 'flex'; document.getElementById('registerTabBtn').style.display = 'flex'; document.getElementById('controlsTabBtn').style.display = 'flex'; showToast('Admin access granted!', 'success'); }
                else { document.getElementById('adminStatus').innerHTML = 'Voter'; showToast('Welcome! You can vote.', 'info'); }
                await loadAllData();
            } catch(e) { showToast('Failed: ' + getReadableError(e), 'error'); }
        };
        
        async function loadAllData() {
            try {
                await refreshChainNow();
                let count = await contract.electionCount();
                document.getElementById('totalElections').textContent = count.toString();
                electionsData = []; let activeCount = 0, totalVotes = 0;
                for (let i = 0; i < count; i++) {
                    let info = await contract.getElectionInfo(i);
                    let candidates = await contract.getAllCandidates(i);
                    let election = { id: i, title: info[0], description: info[1], creator: info[2], startTime: Number(info[3]), endTime: Number(info[4]), isActive: info[5], isPaused: info[6], totalVotes: Number(info[7]), candidateCount: Number(info[8]), registeredVoterCount: Number(info[9]), candidates: [] };
                    const now = chainNow ?? Math.floor(Date.now()/1000);
                    const isEndedByTime = now > election.endTime;
                    const isActiveNow = election.isActive && !election.isPaused && !isEndedByTime;
                    if (isActiveNow) activeCount++;
                    totalVotes += election.totalVotes;
                    for (let j = 0; j < candidates[0].length; j++) { election.candidates.push({ id: j, name: candidates[0][j], description: candidates[1][j], voteCount: Number(candidates[2][j]) }); }
                    electionsData.push(election);
                }
                document.getElementById('activeElections').textContent = activeCount;
                document.getElementById('totalVotes').textContent = totalVotes;
                renderElections();
            } catch(e) { showToast('Error loading data: ' + getReadableError(e), 'error'); }
        }
        
        async function renderElections() {
            let container = document.getElementById('electionsContainer');
            const now = chainNow ?? Math.floor(Date.now()/1000);
            let filtered = electionsData.filter(e => {
                const isEndedByTime = now > e.endTime;
                const isActiveNow = e.isActive && !e.isPaused && !isEndedByTime;
                return currentTab === 'active' ? isActiveNow : !isActiveNow;
            });
            
            if (filtered.length === 0) { 
                container.innerHTML = `
                    <div style="text-align:center;padding:80px;background:var(--card-bg);backdrop-filter:blur(12px);border-radius:32px;border:1px solid var(--glass-border);">
                        <i class="fas fa-folder-open" style="font-size:80px;color:rgba(255,255,255,0.05);margin-bottom:20px;"></i>
                        <h3 style="color:var(--text-muted)">No ${currentTab} elections found</h3>
                        <p style="color:rgba(255,255,255,0.2)">Blockchain records are currently empty for this category.</p>
                    </div>`; 
                return; 
            }

            container.innerHTML = `<div class="elections-grid"></div>`;
            let grid = container.querySelector('.elections-grid');
            
            for (let e of filtered) {
                let hasVoted = await contract.checkHasVoted(e.id, userAddress).catch(()=>false);
                let isRegistered = await contract.isVoterRegistered(e.id, userAddress).catch(()=>false);
                let totalVotes = e.candidates.reduce((s,c)=>s+c.voteCount,0);
                const isEndedByTime = now > e.endTime;
                const isActiveNow = e.isActive && !e.isPaused && !isEndedByTime;
                
                let card = document.createElement('div'); 
                card.className = 'election-card';
                
                let statusLabel = isActiveNow ? '● ACTIVE' : (e.isPaused && !isEndedByTime ? '⏸ PAUSED' : '■ ENDED');
                let statusClass = isActiveNow ? 'status-active' : (e.isPaused && !isEndedByTime ? 'status-paused' : 'status-ended');
                
                card.innerHTML = `
                    <div class="card-header">
                        <span class="status-badge ${statusClass}">${statusLabel}</span>
                        <h3>${escapeHtml(e.title)}</h3>
                        <p style="color:var(--text-muted);font-size:14px;margin-top:5px;">ID: #${e.id}</p>
                    </div>
                    <div class="card-body">
                        <div class="election-meta">
                            <span><i class="far fa-clock"></i> ${isEndedByTime ? 'Ended' : 'Ends'}: ${new Date(e.endTime*1000).toLocaleString()}</span>
                            <span><i class="fas fa-fingerprint"></i> ${e.candidateCount} Options</span>
                            <span><i class="fas fa-chart-pie"></i> ${totalVotes} Total Votes</span>
                        </div>
                        <div class="candidates-list">
                            ${e.candidates.map(c => {
                                const percentage = totalVotes > 0 ? (c.voteCount / totalVotes * 100).toFixed(1) : 0;
                                return `
                                <div class="candidate-item">
                                    <div class="candidate-info">
                                        <div class="candidate-avatar">${c.name.charAt(0)}</div>
                                        <div class="candidate-details">
                                            <div class="candidate-name">${escapeHtml(c.name)}</div>
                                            <div class="candidate-desc">${escapeHtml(c.description)}</div>
                                        </div>
                                        <div style="text-align: right;">
                                            <div class="vote-count">${c.voteCount}</div>
                                            <div style="font-size:11px;color:var(--text-muted);font-weight:700;">${percentage}%</div>
                                        </div>
                                    </div>
                                    <div class="progress-bar">
                                        <div class="progress-fill" style="width: ${percentage}%"></div>
                                    </div>
                                    <div style="display:flex; justify-content:flex-end; margin-top:15px;">
                                        ${isActiveNow && !hasVoted && isRegistered ? 
                                            `<button class="vote-btn" onclick="promptVote(${e.id}, ${c.id}, '${escapeHtml(c.name)}')">Cast Vote</button>` : 
                                            (hasVoted ? '<span class="voted-badge"><i class="fas fa-check-double"></i> Choice Confirmed</span>' : 
                                            (!isRegistered && isActiveNow ? '<span class="voted-badge" style="background:rgba(245,158,11,0.1);color:var(--warning);border-color:rgba(245,158,11,0.2);"><i class="fas fa-user-slash"></i> Unauthorized</span>' : ''))
                                        }
                                    </div>
                                </div>`;
                            }).join('')}
                        </div>
                        ${!isActiveNow ? `
                            <div class="winner-panel">
                                <div class="winner-icon"><i class="fas fa-trophy"></i></div>
                                <div class="winner-info">
                                    <strong>Final Result / Winner</strong>
                                    <div class="winner-name">
                                        ${(()=>{
                                            if(totalVotes === 0) return 'No votes recorded';
                                            const maxVotes = Math.max(...e.candidates.map(c => c.voteCount));
                                            const winners = e.candidates.filter(c => c.voteCount === maxVotes);
                                            
                                            if (winners.length > 1) {
                                                return `<span style="color:var(--warning)"><i class="fas fa-balance-scale"></i> TIE:</span> ${winners.map(w => w.name).join(' & ')} (${maxVotes} votes each)`;
                                            }
                                            return `${winners[0].name} (${maxVotes} votes)`;
                                        })()}
                                    </div>
                                </div>
                            </div>
                        ` : ''}
                    </div>`;
                grid.appendChild(card);
            }
        }
        
        window.promptVote = (id, cid, name) => { pendingVote = { id, cid }; document.getElementById('confirmMessage').innerHTML = `Vote for <strong>${name}</strong>?`; document.getElementById('confirmModal').classList.add('active'); };
        document.getElementById('confirmVoteBtn').onclick = async () => {
            if(!pendingVote) return;
            document.getElementById('confirmModal').classList.remove('active');
            try {
                showToast('Preparing transaction...','info');
                await contract.vote.staticCall(pendingVote.id, pendingVote.cid);
                showToast('Confirm in MetaMask...','info');
                let tx = await contract.vote(pendingVote.id, pendingVote.cid);
                await tx.wait();
                showToast('Vote cast!','success');
                await loadAllData();
                pendingVote = null;
            } catch(e){
                showToast('Failed: '+getReadableError(e),'error');
            }
        };
        document.getElementById('cancelVoteBtn').onclick = () => { document.getElementById('confirmModal').classList.remove('active'); pendingVote = null; };
        
        document.getElementById('addCandidateBtn').onclick = () => { let d = document.getElementById('candidatesContainer'); let div = document.createElement('div'); div.className = 'candidate-input-group'; div.innerHTML = '<input type="text" placeholder="Candidate Name"><input type="text" placeholder="Description / Party">'; d.appendChild(div); };
        document.getElementById('createElectionBtn').onclick = async () => {
            let title = document.getElementById('electionTitle').value;
            let desc = document.getElementById('electionDesc').value;
            let duration = parseInt(document.getElementById('durationMinutes').value);
            let inputs = document.querySelectorAll('.candidate-input-group');
            let names = [], descs = [];
            inputs.forEach(i => { let n = i.children[0].value; let d = i.children[1].value; if(n.trim()){ names.push(n); descs.push(d); } });
            if(!title || names.length<2){ showToast('Title and at least 2 candidates required','error'); return; }
            try {
                let btn = document.getElementById('createElectionBtn');
                btn.innerHTML = '<div class="loading-spinner"></div> Creating...';
                btn.disabled = true;
                showToast('Confirm in MetaMask...','info');
                let tx = await contract.createElection(title, desc, duration, names, descs);
                await tx.wait();
                showToast(`Election "${title}" created!`,'success');
                document.getElementById('electionTitle').value = '';
                document.getElementById('electionDesc').value = '';
                document.getElementById('candidatesContainer').innerHTML = '<div class="candidate-input-group"><input type="text" placeholder="Candidate Name"><input type="text" placeholder="Description / Party"></div>';
                await loadAllData();
                btn.innerHTML = '<i class="fas fa-rocket"></i> Create Election';
                btn.disabled = false;
            } catch(e){
                showToast('Failed: '+getReadableError(e),'error');
                document.getElementById('createElectionBtn').innerHTML = '<i class="fas fa-rocket"></i> Create Election';
                document.getElementById('createElectionBtn').disabled = false;
            }
        };
        
        document.getElementById('addVoterBtn').onclick = () => {
            let d = document.getElementById('votersContainer');
            let div = document.createElement('div');
            div.className = 'voter-input-group';
            div.innerHTML = '<input type="text" placeholder="Wallet Address (0x...)">';
            d.appendChild(div);
        };
        document.getElementById('registerVotersBtn').onclick = async () => {
            let eid = parseInt(document.getElementById('registerElectionId').value);
            let inputs = document.querySelectorAll('#votersContainer .voter-input-group');
            let voters = [];
            inputs.forEach(i => {
                let addr = (i.children[0].value || '').trim();
                if (addr && ethers.isAddress(addr)) {
                    voters.push(addr);
                }
            });
            if(isNaN(eid) || voters.length===0){
                showToast('Enter election ID and at least one valid voter address','error');
                return;
            }
            try {
                let btn = document.getElementById('registerVotersBtn');
                btn.innerHTML = '<div class="loading-spinner"></div> Registering...';
                btn.disabled = true;
                showToast('Checking transaction...','info');
                await contract.registerVoters.staticCall(eid, voters);
                showToast('Confirm in MetaMask...','info');
                let tx = await contract.registerVoters(eid, voters);
                await tx.wait();
                showToast(`${voters.length} voters registered!`,'success');
                await loadAllData();
                btn.innerHTML = '<i class="fas fa-save"></i> Register Voters';
                btn.disabled = false;
            } catch(e){
                showToast('Failed: '+getReadableError(e),'error');
                let btn = document.getElementById('registerVotersBtn');
                btn.innerHTML = '<i class="fas fa-save"></i> Register Voters';
                btn.disabled = false;
            }
        };
        
        document.getElementById('pauseElectionBtn').onclick = async () => { let eid = parseInt(document.getElementById('controlElectionId').value); if(isNaN(eid)){ showToast('Enter election ID','error'); return; } try { showToast('Confirm in MetaMask...','info'); let tx = await contract.pauseElection(eid); await tx.wait(); showToast('Election paused','success'); await loadAllData(); } catch(e){ showToast('Failed: '+getReadableError(e),'error'); } };
        document.getElementById('unpauseElectionBtn').onclick = async () => { let eid = parseInt(document.getElementById('controlElectionId').value); if(isNaN(eid)){ showToast('Enter election ID','error'); return; } try { showToast('Confirm in MetaMask...','info'); let tx = await contract.unpauseElection(eid); await tx.wait(); showToast('Election unpaused','success'); await loadAllData(); } catch(e){ showToast('Failed: '+getReadableError(e),'error'); } };
        document.getElementById('endElectionBtn').onclick = async () => { let eid = parseInt(document.getElementById('controlElectionId').value); if(isNaN(eid)){ showToast('Enter election ID','error'); return; } try { showToast('Confirm in MetaMask...','info'); let tx = await contract.endElection(eid); await tx.wait(); showToast('Election ended','success'); await loadAllData(); } catch(e){ showToast('Failed: '+getReadableError(e),'error'); } };
        document.getElementById('extendElectionBtn').onclick = async () => { let eid = parseInt(document.getElementById('controlElectionId').value); let mins = parseInt(document.getElementById('extendMinutes').value); if(isNaN(eid) || isNaN(mins)){ showToast('Enter election ID and minutes','error'); return; } try { showToast('Confirm in MetaMask...','info'); let tx = await contract.extendElection(eid, mins); await tx.wait(); showToast(`Election extended by ${mins} minutes`,'success'); await loadAllData(); } catch(e){ showToast('Failed: '+getReadableError(e),'error'); } };
        
        document.querySelectorAll('.tab-btn').forEach(btn => { btn.onclick = () => { document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); currentTab = btn.dataset.tab; document.getElementById('adminPanel').style.display = 'none'; document.getElementById('registerPanel').style.display = 'none'; document.getElementById('controlsPanel').style.display = 'none'; document.getElementById('electionsContainer').style.display = 'block'; if(currentTab === 'admin'){ document.getElementById('adminPanel').style.display = 'block'; document.getElementById('electionsContainer').style.display = 'none'; } else if(currentTab === 'register'){ document.getElementById('registerPanel').style.display = 'block'; document.getElementById('electionsContainer').style.display = 'none'; } else if(currentTab === 'controls'){ document.getElementById('controlsPanel').style.display = 'block'; document.getElementById('electionsContainer').style.display = 'none'; } else { renderElections(); } }; });
        
        function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m; }); }
    </script>
</body>
</html>
