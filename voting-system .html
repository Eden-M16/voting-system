<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoteChain - Decentralized Voting Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #4361ee;
            --primary-dark: #3a56d4;
            --secondary: #7209b7;
            --success: #06ffa5;
            --danger: #ef476f;
            --warning: #ffd166;
            --dark: #0f172a;
            --light: #f8fafc;
            --gray: #64748b;
            --card-bg: rgba(255, 255, 255, 0.95);
            --gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--gradient);
            min-height: 100vh;
            color: var(--dark);
        }

        /* Animated Background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .bg-animation::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: moveGrid 20s linear infinite;
        }

        @keyframes moveGrid {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        /* Container */
        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 20px 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .logo h1 {
            font-size: 28px;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo p {
            font-size: 12px;
            color: var(--gray);
            margin-top: 5px;
        }

        .wallet-status {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .network-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #e8f5e9;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
        }

        .network-badge i {
            color: var(--success);
            font-size: 12px;
        }

        .connect-btn {
            background: var(--gradient);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .connect-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(67, 97, 238, 0.4);
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            background: var(--gradient);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
        }

        .stat-info h3 {
            font-size: 28px;
            font-weight: 700;
            color: var(--dark);
        }

        .stat-info p {
            color: var(--gray);
            font-size: 14px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.9);
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn.active {
            background: var(--gradient);
            color: white;
        }

        .tab-btn:hover:not(.active) {
            background: white;
            transform: translateY(-2px);
        }

        /* Election Cards */
        .elections-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 25px;
        }

        .election-card {
            background: white;
            border-radius: 24px;
            overflow: hidden;
            transition: all 0.3s;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .election-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
        }

        .card-header {
            background: var(--gradient);
            padding: 20px;
            color: white;
            position: relative;
        }

        .card-header h3 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .status-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-active {
            background: rgba(6, 255, 165, 0.3);
            color: #06ffa5;
        }

        .status-ended {
            background: rgba(239, 71, 111, 0.3);
            color: #ef476f;
        }

        .card-body {
            padding: 20px;
        }

        .election-meta {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            font-size: 14px;
            color: var(--gray);
        }

        .election-meta i {
            margin-right: 5px;
        }

        .candidates-list {
            margin: 20px 0;
        }

        .candidate-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
            transition: background 0.3s;
        }

        .candidate-item:hover {
            background: #f8fafc;
        }

        .candidate-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .candidate-avatar {
            width: 40px;
            height: 40px;
            background: var(--gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .candidate-name {
            font-weight: 600;
        }

        .candidate-party {
            font-size: 12px;
            color: var(--gray);
        }

        .vote-count {
            font-weight: 600;
            color: var(--primary);
        }

        .vote-btn {
            background: var(--gradient);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .vote-btn:hover {
            transform: scale(1.05);
        }

        .vote-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .voted-badge {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .progress-bar {
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
            margin: 15px 0;
        }

        .progress-fill {
            height: 100%;
            background: var(--gradient);
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        /* Admin Panel */
        .admin-panel {
            background: white;
            border-radius: 24px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .admin-panel h2 {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-family: inherit;
            transition: all 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
        }

        .candidate-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .candidate-input-group input {
            flex: 1;
            padding: 10px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 24px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-icon {
            font-size: 50px;
            margin-bottom: 20px;
        }

        .modal-content h3 {
            margin-bottom: 10px;
        }

        .modal-content p {
            color: var(--gray);
            margin-bottom: 20px;
        }

        /* Loading Spinner */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
        }

        .toast {
            background: white;
            border-radius: 12px;
            padding: 15px 20px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            animation: slideInRight 0.3s ease;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .toast.success { border-left: 4px solid var(--success); }
        .toast.error { border-left: 4px solid var(--danger); }
        .toast.info { border-left: 4px solid var(--primary); }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
            }
            
            .elections-grid {
                grid-template-columns: 1fr;
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px;
            background: white;
            border-radius: 24px;
        }

        .empty-state i {
            font-size: 64px;
            color: var(--gray);
            margin-bottom: 20px;
        }

        .empty-state h3 {
            margin-bottom: 10px;
        }

        .empty-state p {
            color: var(--gray);
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <h1><i class="fas fa-vote-yea"></i> VoteChain</h1>
                <p>Decentralized • Transparent • Immutable</p>
            </div>
            <div class="wallet-status">
                <div class="network-badge">
                    <i class="fas fa-circle"></i>
                    <span id="networkStatus">Not Connected</span>
                </div>
                <button class="connect-btn" id="connectWalletBtn">
                    <i class="fas fa-wallet"></i>
                    <span>Connect Wallet</span>
                </button>
            </div>
        </div>

        <!-- Stats Cards -->
        <div class="stats-grid" id="statsGrid" style="display: none;">
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-chalkboard"></i></div>
                <div class="stat-info">
                    <h3 id="totalElections">0</h3>
                    <p>Total Elections</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-play-circle"></i></div>
                <div class="stat-info">
                    <h3 id="activeElections">0</h3>
                    <p>Active Elections</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-users"></i></div>
                <div class="stat-info">
                    <h3 id="totalVotes">0</h3>
                    <p>Total Votes Cast</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-user-shield"></i></div>
                <div class="stat-info">
                    <h3 id="adminStatus">-</h3>
                    <p>Your Role</p>
                </div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs" id="tabs" style="display: none;">
            <button class="tab-btn active" data-tab="active">
                <i class="fas fa-play"></i> Active Elections
            </button>
            <button class="tab-btn" data-tab="ended">
                <i class="fas fa-flag-checkered"></i> Ended Elections
            </button>
            <button class="tab-btn admin-tab" data-tab="admin" id="adminTabBtn" style="display: none;">
                <i class="fas fa-crown"></i> Admin Panel
            </button>
        </div>

        <!-- Admin Panel -->
        <div id="adminPanel" class="admin-panel" style="display: none;">
            <h2><i class="fas fa-crown" style="color: #ffd166;"></i> Create New Election</h2>
            <div class="form-group">
                <label><i class="fas fa-tag"></i> Election Title</label>
                <input type="text" id="electionTitle" class="form-control" placeholder="e.g., Presidential Election 2024">
            </div>
            <div class="form-group">
                <label><i class="fas fa-clock"></i> Duration (minutes)</label>
                <input type="number" id="durationMinutes" class="form-control" value="1440">
                <small style="color: var(--gray);">1440 minutes = 24 hours</small>
            </div>
            <div class="form-group">
                <label><i class="fas fa-users"></i> Candidates</label>
                <div id="candidatesContainer">
                    <div class="candidate-input-group">
                        <input type="text" placeholder="Candidate Name" class="candidate-name-input">
                        <input type="text" placeholder="Party/Description" class="candidate-party-input">
                    </div>
                </div>
                <button type="button" id="addCandidateBtn" style="background: none; color: var(--primary); border: 2px dashed var(--primary); padding: 10px; margin-top: 10px;">
                    <i class="fas fa-plus"></i> Add Candidate
                </button>
            </div>
            <button id="createElectionBtn" style="background: var(--gradient); width: 100%; padding: 14px; font-size: 16px;">
                <i class="fas fa-rocket"></i> Create Election
            </button>
        </div>

        <!-- Elections Container -->
        <div id="electionsContainer"></div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Confirmation Modal -->
    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <div class="modal-icon">
                <i class="fas fa-check-circle" style="color: var(--success); font-size: 60px;"></i>
            </div>
            <h3>Confirm Vote</h3>
            <p id="confirmMessage">Are you sure you want to vote for this candidate?</p>
            <button id="confirmVoteBtn" style="background: var(--gradient); padding: 12px 24px; margin-right: 10px;">Confirm</button>
            <button id="cancelVoteBtn" style="background: var(--gray); padding: 12px 24px;">Cancel</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/ethers@6.10.0/dist/ethers.umd.min.js"></script>
    <script>
        // Contract Details
        const CONTRACT_ADDRESS = "0x13100E329e5916aEd38457797cBa5d49A2F87ADD";
        
        const CONTRACT_ABI = [
            {"inputs":[],"stateMutability":"nonpayable","type":"constructor"},
            {"anonymous":false,"inputs":[{"indexed":false,"internalType":"uint256","name":"electionId","type":"uint256"},{"indexed":false,"internalType":"string","name":"title","type":"string"}],"name":"ElectionCreated","type":"event"},
            {"anonymous":false,"inputs":[{"indexed":false,"internalType":"uint256","name":"electionId","type":"uint256"},{"indexed":false,"internalType":"address","name":"voter","type":"address"}],"name":"Voted","type":"event"},
            {"inputs":[{"internalType":"string","name":"_title","type":"string"},{"internalType":"uint256","name":"_durationMinutes","type":"uint256"},{"internalType":"string[]","name":"_candidateNames","type":"string[]"}],"name":"createElection","outputs":[],"stateMutability":"nonpayable","type":"function"},
            {"inputs":[],"name":"electionId","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
            {"inputs":[{"internalType":"uint256","name":"","type":"uint256"}],"name":"elections","outputs":[{"internalType":"string","name":"title","type":"string"},{"internalType":"bool","name":"active","type":"bool"},{"internalType":"uint256","name":"endTime","type":"uint256"}],"stateMutability":"view","type":"function"},
            {"inputs":[{"internalType":"uint256","name":"_electionId","type":"uint256"}],"name":"endElection","outputs":[],"stateMutability":"nonpayable","type":"function"},
            {"inputs":[{"internalType":"uint256","name":"_electionId","type":"uint256"},{"internalType":"uint256","name":"_candidateIndex","type":"uint256"}],"name":"getCandidate","outputs":[{"internalType":"string","name":"name","type":"string"},{"internalType":"uint256","name":"votes","type":"uint256"}],"stateMutability":"view","type":"function"},
            {"inputs":[{"internalType":"uint256","name":"_electionId","type":"uint256"}],"name":"getElectionInfo","outputs":[{"internalType":"string","name":"title","type":"string"},{"internalType":"bool","name":"active","type":"bool"},{"internalType":"uint256","name":"endTime","type":"uint256"},{"internalType":"uint256","name":"candidateCount","type":"uint256"}],"stateMutability":"view","type":"function"},
            {"inputs":[{"internalType":"uint256","name":"_electionId","type":"uint256"},{"internalType":"address","name":"_voter","type":"address"}],"name":"hasVoted","outputs":[{"internalType":"bool","name":"","type":"bool"}],"stateMutability":"view","type":"function"},
            {"inputs":[],"name":"owner","outputs":[{"internalType":"address","name":"","type":"address"}],"stateMutability":"view","type":"function"},
            {"inputs":[{"internalType":"uint256","name":"_electionId","type":"uint256"},{"internalType":"uint256","name":"_candidateIndex","type":"uint256"}],"name":"vote","outputs":[],"stateMutability":"nonpayable","type":"function"}
        ];
        
        let provider, signer, contract, userAddress;
        let electionsData = [];
        let currentTab = 'active';
        let pendingVote = null;
        
        // Toast Notifications
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-info-circle' };
            toast.innerHTML = `
                <i class="fas ${icons[type]}" style="color: ${type === 'success' ? '#06ffa5' : type === 'error' ? '#ef476f' : '#4361ee'}"></i>
                <span>${message}</span>
            `;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 5000);
        }
        
        // Connect Wallet
        document.getElementById('connectWalletBtn').onclick = async () => {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    provider = new ethers.BrowserProvider(window.ethereum);
                    await provider.send("eth_requestAccounts", []);
                    signer = await provider.getSigner();
                    userAddress = await signer.getAddress();
                    
                    const network = await provider.getNetwork();
                    const chainId = Number(network.chainId);
                    
                    if (chainId !== 11155111) {
                        showToast('Please switch to Sepolia Testnet', 'error');
                        try {
                            await window.ethereum.request({
                                method: 'wallet_switchEthereumChain',
                                params: [{ chainId: '0xaa36a7' }]
                            });
                        } catch (e) {}
                        return;
                    }
                    
                    contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);
                    
                    document.getElementById('networkStatus').innerHTML = '<i class="fas fa-check-circle"></i> Sepolia';
                    document.querySelector('.connect-btn span').textContent = `${userAddress.slice(0,6)}...${userAddress.slice(-4)}`;
                    
                    document.getElementById('statsGrid').style.display = 'grid';
                    document.getElementById('tabs').style.display = 'flex';
                    
                    const owner = await contract.owner();
                    const isAdmin = userAddress.toLowerCase() === owner.toLowerCase();
                    
                    if (isAdmin) {
                        document.getElementById('adminStatus').innerHTML = 'Admin';
                        document.getElementById('adminTabBtn').style.display = 'flex';
                        showToast('Welcome Admin! You can create and manage elections.', 'success');
                    } else {
                        document.getElementById('adminStatus').innerHTML = 'Voter';
                        showToast('Welcome! You can vote in active elections.', 'info');
                    }
                    
                    await loadAllData();
                } catch (error) {
                    showToast('Failed to connect: ' + error.message, 'error');
                }
            } else {
                showToast('Please install MetaMask!', 'error');
                window.open('https://metamask.io/download.html', '_blank');
            }
        };
        
        // Load all data
        async function loadAllData() {
            try {
                const count = await contract.electionId();
                document.getElementById('totalElections').textContent = count;
                
                electionsData = [];
                let activeCount = 0;
                let totalVotes = 0;
                
                for (let i = 0; i < count; i++) {
                    const info = await contract.getElectionInfo(i);
                    const election = {
                        id: i,
                        title: info[0],
                        isActive: info[1],
                        endTime: Number(info[2]),
                        candidateCount: Number(info[3]),
                        candidates: []
                    };
                    
                    if (election.isActive) activeCount++;
                    
                    for (let j = 0; j < election.candidateCount; j++) {
                        const candidate = await contract.getCandidate(i, j);
                        election.candidates.push({
                            index: j,
                            name: candidate[0],
                            votes: Number(candidate[1])
                        });
                        totalVotes += Number(candidate[1]);
                    }
                    
                    electionsData.push(election);
                }
                
                document.getElementById('activeElections').textContent = activeCount;
                document.getElementById('totalVotes').textContent = totalVotes;
                
                renderElections();
            } catch (error) {
                showToast('Error loading data: ' + error.message, 'error');
            }
        }
        
        // Render elections
        async function renderElections() {
            const container = document.getElementById('electionsContainer');
            const filtered = electionsData.filter(e => currentTab === 'active' ? e.isActive : !e.isActive);
            
            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <h3>No ${currentTab} elections</h3>
                        <p>${currentTab === 'active' ? 'Create a new election to get started!' : 'No completed elections yet.'}</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = `<div class="elections-grid"></div>`;
            const grid = container.querySelector('.elections-grid');
            
            for (const election of filtered) {
                const hasVoted = await contract.hasVoted(election.id, userAddress).catch(() => false);
                const totalVotesForElection = election.candidates.reduce((sum, c) => sum + c.votes, 0);
                
                const card = document.createElement('div');
                card.className = 'election-card';
                card.innerHTML = `
                    <div class="card-header">
                        <h3>${escapeHtml(election.title)}</h3>
                        <span class="status-badge ${election.isActive ? 'status-active' : 'status-ended'}">
                            ${election.isActive ? '● ACTIVE' : '■ ENDED'}
                        </span>
                    </div>
                    <div class="card-body">
                        <div class="election-meta">
                            <span><i class="far fa-calendar-alt"></i> Ends: ${new Date(election.endTime * 1000).toLocaleString()}</span>
                            <span><i class="fas fa-users"></i> ${election.candidates.length} Candidates</span>
                            <span><i class="fas fa-chart-line"></i> ${totalVotesForElection} Votes</span>
                        </div>
                        <div class="candidates-list">
                            ${election.candidates.map(candidate => `
                                <div class="candidate-item">
                                    <div class="candidate-info">
                                        <div class="candidate-avatar">${candidate.name.charAt(0)}</div>
                                        <div>
                                            <div class="candidate-name">${escapeHtml(candidate.name)}</div>
                                            <div class="candidate-party">${candidate.votes} votes</div>
                                        </div>
                                    </div>
                                    ${election.isActive && !hasVoted ? 
                                        `<button class="vote-btn" onclick="promptVote(${election.id}, ${candidate.index}, '${escapeHtml(candidate.name)}')">
                                            <i class="fas fa-check"></i> Vote
                                        </button>` : 
                                        (hasVoted ? '<span class="voted-badge"><i class="fas fa-check"></i> Voted</span>' : '')}
                                </div>
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: ${totalVotesForElection > 0 ? (candidate.votes / totalVotesForElection * 100) : 0}%"></div>
                                </div>
                            `).join('')}
                        </div>
                        ${!election.isActive ? `
                            <div class="result" style="margin-top: 15px; padding: 10px; background: #f1f5f9; border-radius: 12px;">
                                <strong><i class="fas fa-trophy"></i> Winner: </strong>
                                ${(() => {
                                    const winner = election.candidates.reduce((a, b) => a.votes > b.votes ? a : b, { name: 'No votes', votes: 0 });
                                    return `${winner.name} (${winner.votes} votes)`;
                                })()}
                            </div>
                        ` : ''}
                    </div>
                `;
                grid.appendChild(card);
            }
        }
        
        // Prompt vote confirmation
        window.promptVote = (electionId, candidateIndex, candidateName) => {
            pendingVote = { electionId, candidateIndex };
            document.getElementById('confirmMessage').innerHTML = `Are you sure you want to vote for <strong>${candidateName}</strong>?`;
            document.getElementById('confirmModal').classList.add('active');
        };
        
        // Confirm vote
        document.getElementById('confirmVoteBtn').onclick = async () => {
            if (!pendingVote) return;
            document.getElementById('confirmModal').classList.remove('active');
            
            try {
                showToast('Casting your vote...', 'info');
                const tx = await contract.vote(pendingVote.electionId, pendingVote.candidateIndex);
                await tx.wait();
                showToast('Vote cast successfully!', 'success');
                await loadAllData();
                pendingVote = null;
            } catch (error) {
                showToast('Failed to vote: ' + error.message, 'error');
            }
        };
        
        document.getElementById('cancelVoteBtn').onclick = () => {
            document.getElementById('confirmModal').classList.remove('active');
            pendingVote = null;
        };
        
        // Admin functions
        document.getElementById('addCandidateBtn').onclick = () => {
            const container = document.getElementById('candidatesContainer');
            const div = document.createElement('div');
            div.className = 'candidate-input-group';
            div.innerHTML = `
                <input type="text" placeholder="Candidate Name" class="candidate-name-input">
                <input type="text" placeholder="Party/Description" class="candidate-party-input">
            `;
            container.appendChild(div);
        };
        
        document.getElementById('createElectionBtn').onclick = async () => {
            const title = document.getElementById('electionTitle').value;
            const duration = parseInt(document.getElementById('durationMinutes').value);
            const nameInputs = document.querySelectorAll('.candidate-name-input');
            const partyInputs = document.querySelectorAll('.candidate-party-input');
            
            const candidates = [];
            for (let i = 0; i < nameInputs.length; i++) {
                if (nameInputs[i].value.trim()) {
                    candidates.push(nameInputs[i].value.trim());
                }
            }
            
            if (!title) {
                showToast('Please enter an election title', 'error');
                return;
            }
            if (candidates.length < 2) {
                showToast('Please add at least 2 candidates', 'error');
                return;
            }
            
            try {
                const btn = document.getElementById('createElectionBtn');
                btn.innerHTML = '<div class="loading-spinner"></div> Creating...';
                btn.disabled = true;
                
                const tx = await contract.createElection(title, duration, candidates);
                await tx.wait();
                
                showToast(`Election "${title}" created successfully!`, 'success');
                document.getElementById('electionTitle').value = '';
                document.getElementById('candidatesContainer').innerHTML = `
                    <div class="candidate-input-group">
                        <input type="text" placeholder="Candidate Name" class="candidate-name-input">
                        <input type="text" placeholder="Party/Description" class="candidate-party-input">
                    </div>
                `;
                await loadAllData();
                btn.innerHTML = '<i class="fas fa-rocket"></i> Create Election';
                btn.disabled = false;
            } catch (error) {
                showToast('Failed to create election: ' + error.message, 'error');
                document.getElementById('createElectionBtn').innerHTML = '<i class="fas fa-rocket"></i> Create Election';
                document.getElementById('createElectionBtn').disabled = false;
            }
        };
        
        // Tab switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTab = btn.dataset.tab;
                
                if (currentTab === 'admin') {
                    document.getElementById('adminPanel').style.display = 'block';
                    document.getElementById('electionsContainer').style.display = 'none';
                } else {
                    document.getElementById('adminPanel').style.display = 'none';
                    document.getElementById('electionsContainer').style.display = 'block';
                    renderElections();
                }
            };
        });
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
    </script>
</body>
</html>
